<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미국언니 네일 결제안내</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
        
        /* 전체 배경: 예술적인 라인 드로잉 일러스트를 배경으로 설정 */
        .wrapper { 
            display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; 
            background-color: #ffffff;
            /* 네일/손 관련 라인아트 드로잉을 배경으로 사용 */
            background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png'), 
                              linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)),
                              url('https://img.freepik.com/free-vector/hand-drawn-minimalist-finger-nail-illustration_23-2148915006.jpg'); 
            background-size: auto, cover, contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 가운데 로고 카드 (사장님이 주신 card.jpg 그대로 사용) */
        .card-display {
            width: 100%; max-width: 500px; aspect-ratio: 1024 / 637;
            background: url('card.jpg') no-repeat center center;
            background-size: cover; border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            z-index: 10; margin-bottom: 30px;
        }

        .info-section { text-align: center; width: 100%; z-index: 10; }
        .info-text { margin-bottom: 15px; font-size: 22px; font-weight: 800; color: #333; letter-spacing: -0.5px; }
        
        /* 버튼 디자인: 드로잉과 어울리는 딥한 골드/블랙 톤 */
        .copy-btn {
            width: 100%; max-width: 350px; background-color: #1a1a1a; color: #fff;
            border: none; padding: 22px; border-radius: 12px; font-size: 19px;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .copy-btn:active { background-color: #444; transform: scale(0.98); }
        
        .hint { margin-top: 15px; font-size: 14px; color: #666; font-weight: 500; }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card-display"></div>

        <div class="info-section">
            <div class="info-text">농협) 박가은(미국언니)</div>
            <button class="copy-btn" onclick="copyAccount()">계좌번호 복사하기</button>
            <div class="hint">버튼을 누르면 번호가 자동으로 복사됩니다.</div>
        </div>
    </div>

    <script>
        function copyAccount() {
            var accountNumber = "352-1399-5866-33";
            var textArea = document.createElement("textarea");
            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 9999);
            try {
                document.execCommand('copy');
                alert("💅 미국언니 계좌가 복사되었습니다!\n352-1399-5866-33 (박가은)");
            } catch (err) {
                alert("복사에 실패했습니다.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
