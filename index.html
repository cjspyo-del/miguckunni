<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미국언니 네일 결제안내</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
        
        /* 전체 배경: 사장님의 bg.jpg 그대로 사용 */
        .wrapper { 
            display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; 
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
        }

        /* [핵심 수정] 중앙 정보 영역에 반투명 하얀색 배경 깔기 */
        .main-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: rgba(255, 255, 255, 0.92); /* 배경그림이 은은하게 비치는 하얀색 */
            padding: 40px 20px; border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px); /* 배경그림을 살짝 흐리게 해서 글씨 집중도 향상 */
            width: 100%; max-width: 500px;
        }

        /* '미국언니' 카드 */
        .card-display {
            width: 100%; max-width: 420px; aspect-ratio: 1024 / 637;
            background: url('card.jpg') no-repeat center center;
            background-size: cover; border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .info-section { text-align: center; width: 100%; }
        /* 글씨 크기를 키우고 더 진하게 수정 */
        .info-text { margin-bottom: 20px; font-size: 24px; font-weight: 800; color: #333; }
        
        .copy-btn {
            width: 100%; max-width: 320px; background-color: #4a3427; color: #fff;
            border: none; padding: 20px; border-radius: 50px; font-size: 19px;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(74, 52, 39, 0.3);
        }
        .copy-btn:active { transform: scale(0.96); background-color: #2a1d16; }
        
        /* 힌트 문구도 선명하게 수정 */
        .hint { margin-top: 20px; font-size: 15px; color: #555; font-weight: 600; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 중앙 정보 영역을 감싸는 새로운 박스 -->
        <div class="main-content">
            <div class="card-display"></div>
            <div class="info-section">
                <div class="info-text">농협 박가은(미국언니)</div>
                <button class="copy-btn" onclick="copyAccount()">계좌번호 복사하기</button>
                <div class="hint">버튼을 누르면 번호가 자동으로 복사됩니다.</div>
            </div>
        </div>
    </div>
    <script>
        function copyAccount() {
            var accountNumber = "352-1399-5866-33";
            var textArea = document.createElement("textarea");
            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 9999);
            try {
                document.execCommand('copy');
                alert("💅 미국언니 계좌번호가 복사되었습니다!\n352-1399-5866-33 (박가은)");
            } catch (err) {
                alert("복사에 실패했습니다.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
