<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미국언니 결제안내</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #f4f1ea; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .card-display {
            width: 100%; max-width: 500px; aspect-ratio: 1024 / 637;
            background: url('card.jpg') no-repeat center center;
            background-size: cover; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); margin-bottom: 40px;
        }
        .info-text { margin-bottom: 20px; font-size: 20px; font-weight: bold; color: #4a3427; text-align: center; }
        .copy-btn {
            width: 100%; max-width: 350px; background-color: #d4af37; color: #fff;
            border: none; padding: 20px; border-radius: 15px; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .copy-btn:active { background-color: #b8952e; transform: scale(0.95); }
        .hint { margin-top: 20px; font-size: 14px; color: #8a7b6a; text-align: center; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card-display"></div>
        <div class="info-text">농협 박가은(미국언니)</div>
        <button class="copy-btn" onclick="copyAccount()">계좌번호 복사하기</button>
        <div class="hint">버튼을 누르면 번호가 자동으로 복사됩니다.</div>
    </div>
    <script>
        function copyAccount() {
            var accountNumber = "352-1399-5866-33";
            var textArea = document.createElement("textarea");
            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 9999);
            try {
                document.execCommand('copy');
                alert("농협 계좌번호가 복사되었습니다!\n352-1399-5866-33\n예금주: 박가은");
            } catch (err) {
                alert("복사에 실패했습니다.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
