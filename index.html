<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미국언니 네일 결제안내</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
        
        /* 배경 이미지를 bg.jpg로 꽉 채우기 */
        .wrapper { 
            display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; 
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
        }

        /* 중앙 로고 카드 */
        .card-display {
            width: 100%; max-width: 480px; aspect-ratio: 1024 / 637;
            background: url('card.jpg') no-repeat center center;
            background-size: cover; border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            z-index: 10; margin-bottom: 35px;
        }

        .info-section { text-align: center; width: 100%; z-index: 10; }
        .info-text { margin-bottom: 20px; font-size: 22px; font-weight: 800; color: #4a3427; text-shadow: 0 2px 4px rgba(255,255,255,0.8); }
        
        .copy-btn {
            width: 100%; max-width: 340px; background-color: #4a3427; color: #fff;
            border: none; padding: 22px; border-radius: 50px; font-size: 19px;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(74, 52, 39, 0.4);
        }
        .copy-btn:active { transform: scale(0.96); background-color: #2a1d16; }
        
        .hint { margin-top: 18px; font-size: 14px; color: #6d5442; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card-display"></div>
        <div class="info-section">
            <div class="info-text">농협 박가은(미국언니)</div>
            <button class="copy-btn" onclick="copyAccount()">계좌번호 복사하기</button>
            <div class="hint">버튼을 누르면 번호가 자동으로 복사됩니다.</div>
        </div>
    </div>
    <script>
        function copyAccount() {
            var accountNumber = "352-1399-5866-33";
            var textArea = document.createElement("textarea");
            textArea.value = accountNumber;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 9999);
            try {
                document.execCommand('copy');
                alert("💅 미국언니 계좌번호가 복사되었습니다!\n352-1399-5866-33 (박가은)");
            } catch (err) {
                alert("복사에 실패했습니다.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
